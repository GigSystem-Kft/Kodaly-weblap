<title id="title">Kvintkör – dúr hangnemek és párhuzamos molljaik</title>
<desc id="desc">C-dúrtól az óramutató járásával egyezően kvintenként: G, D, A, E, H, Fisz és Gesz. A másik irányban: F, B, Esz, Asz, Desz és Gesz. Belül az azonos előjegyzésű moll hangnemek.</desc>
