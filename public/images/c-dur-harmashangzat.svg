<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">C-dúr hármashangzat: C–E–G</title>
<desc id="desc">Zongorabillentyűzet, amelyen a C, E és G hangok kiemelve láthatók. A C és E közötti távolság nagy terc, az E és G közötti távolság kis terc.</desc>
<rect width="900" height="590" fill="#fbfcff"/>
<text x="450" y="70" font-family="Georgia,serif" font-weight="700" font-size="40" fill="#182744" text-anchor="middle">C-dúr hármashangzat</text>
<text x="450" y="118" font-family="Arial,sans-serif" font-size="25" fill="#334669" text-anchor="middle">C – E – G</text>
<text x="450" y="170" font-family="Arial,sans-serif" font-size="18" fill="#334669" text-anchor="middle">Alaphang · nagy terc · tiszta kvint</text>
<rect x="108" y="208" width="94" height="250" rx="6" fill="#c7d8ff" stroke="#2b3854" stroke-width="2"/><text x="155" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1c2c4c">C</text><rect x="206" y="208" width="94" height="250" rx="6" fill="#fff" stroke="#2b3854" stroke-width="2"/><text x="253" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#1c2c4c">D</text><rect x="304" y="208" width="94" height="250" rx="6" fill="#c7d8ff" stroke="#2b3854" stroke-width="2"/><text x="351" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1c2c4c">E</text><rect x="402" y="208" width="94" height="250" rx="6" fill="#fff" stroke="#2b3854" stroke-width="2"/><text x="449" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#1c2c4c">F</text><rect x="500" y="208" width="94" height="250" rx="6" fill="#c7d8ff" stroke="#2b3854" stroke-width="2"/><text x="547" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1c2c4c">G</text><rect x="598" y="208" width="94" height="250" rx="6" fill="#fff" stroke="#2b3854" stroke-width="2"/><text x="645" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#1c2c4c">A</text><rect x="696" y="208" width="94" height="250" rx="6" fill="#fff" stroke="#2b3854" stroke-width="2"/><text x="743" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#1c2c4c">H</text><rect x="178" y="208" width="48" height="152" rx="5" fill="#283550" stroke="#283550"/><title>Cisz</title><rect x="276" y="208" width="48" height="152" rx="5" fill="#283550" stroke="#283550"/><title>Disz</title><rect x="472" y="208" width="48" height="152" rx="5" fill="#283550" stroke="#283550"/><title>Fisz</title><rect x="570" y="208" width="48" height="152" rx="5" fill="#283550" stroke="#283550"/><title>Gisz</title><rect x="668" y="208" width="48" height="152" rx="5" fill="#283550" stroke="#283550"/><title>Aisz</title>
<text x="450" y="512" font-family="Arial,sans-serif" font-size="21" fill="#1f3153" text-anchor="middle">C–E: nagy terc (4 félhang) · E–G: kis terc (3 félhang)</text>
<text x="450" y="548" font-family="Arial,sans-serif" font-size="16" fill="#53637d" text-anchor="middle">A kék billentyűk együtt alkotják a C-dúr hármashangzatot.</text>
</svg>