name: Zeneelméleti Műhely – npm lockfile javítás PR-ágon

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lockfile-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    # Never grant push to an external fork; only this repo's selected release PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/audit-p0-search-release-quiz-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install in an isolated directory
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          cp package.json package-lock.json "$verify_dir/"
          cd "$verify_dir"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure only package-lock.json was changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != 'package-lock.json' ]; then
            echo "Refusing unintended changes: $changed" >&2
            exit 1
          fi
      - name: Commit verified lockfile to the existing PR branch only
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'build(deps): synchronize verified npm lockfile'
          git push origin "HEAD:refs/heads/$HEAD_REF"
