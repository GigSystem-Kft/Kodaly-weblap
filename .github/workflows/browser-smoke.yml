name: Zeneelméleti Műhely – Chromium böngészős füstteszt
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/browser-smoke.mjs'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies and fixed browser runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Build production frontend
        env:
          VITE_PHP_API: '1'
        run: npm run build
      - name: Browser acceptance smoke test
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/zm-vite.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/zm-vite.log' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then break; fi
            sleep .5
          done
          node scripts/browser-smoke.mjs
