name: Zeneelméleti Műhely – PHP telepítő ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/reszletes-tananyag-tobb-feladat-20261104'
  # The release gate must run for every PR update, including docs-only changes.
  # Restricting paths can leave checks absent for the eventual merge commit.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: zeneelmelet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean Linux dependencies
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: TypeScript and unit tests
        run: |
          npm test
          npm run lint
      - name: Install PHP mail transport
        run: |
          set -euo pipefail
          cd php/api
          # GitHub's PHPMailer ZIP endpoint occasionally resets connections.
          # Retry transport errors, but still fail the release if installation
          # cannot complete; never assemble a ZIP without its mail dependency.
          for attempt in 1 2 3; do
            # The third attempt uses Git source checkout if the dist ZIP
            # service repeatedly drops the connection.
            if [ "$attempt" -eq 3 ]; then
              preference=--prefer-source
            else
              preference=--prefer-dist
            fi
            if composer install --no-dev "$preference" --no-interaction --no-progress --optimize-autoloader; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Composer dependency installation failed after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: PHP syntax check
        run: |
          php -v
          php -l php/api/index.php
          php -l php/api/admin.php
          php -l php/api/music-answers.php
          php -l php/api/creative-answers.php
          php scripts/test-php-creative-answers.php
          php scripts/test-php-music-answers.php
          php -l php/api/tutor-visuals.php
          php scripts/test-php-tutor-visuals.php
          php -l php/api/tutor-image-generation.php
          php -l php/api/tutor-text-generation.php
          php scripts/test-php-tutor-text-generation.php
          php -l php/api/tutor-sources.php
          php -l php/api/tutor-search.php
          php -l php/api/deployment-audit.php
          php scripts/test-php-deployment-audit.php
          php scripts/test-php-tutor-search.php
          php scripts/test-php-tutor-sources.php
          php scripts/test-php-tutor-image-generation.php
          php -l deploy/zeneelmelet-private.example.php
          node --check scripts/create-invitation.mjs
      - name: Test tutor chat and status without account MySQL
        run: bash scripts/test-php-chat-no-database.sh
      - name: Test invitation signup against MySQL
        run: bash scripts/test-php-invitations.sh
      - name: Build frontend for PHP API
        env:
          VITE_PHP_API: '1'
        run: npm run build
      - name: Assemble root-ready CloudPanel ZIP
        run: |
          set -euo pipefail
          mkdir -p release/api
          cp -a dist/. release/
          cp php/api/index.php release/api/index.php
          cp php/api/admin.php release/api/admin.php
          cp php/api/deployment-audit.php release/api/deployment-audit.php
          cp php/api/music-answers.php release/api/music-answers.php
          cp php/api/creative-answers.php release/api/creative-answers.php
          cp php/api/tutor-visuals.php release/api/tutor-visuals.php
          cp php/api/tutor-image-generation.php release/api/tutor-image-generation.php
          cp php/api/tutor-text-generation.php release/api/tutor-text-generation.php
          cp php/api/tutor-sources.php release/api/tutor-sources.php
          cp php/api/tutor-search.php release/api/tutor-search.php
          cp -a php/api/vendor release/api/vendor
          node --import tsx scripts/export-php-knowledge.ts release/api/knowledge.php
          node --import tsx scripts/verify-php-knowledge-parity.ts release/api/knowledge.php
          # A-07: the live PHP assistant must contain all 1,793 chapter 09
          # glossary entries, even if its total chunk count differs from
          # the separately generated frontend/source-inventory.json report.
          php -r '$k=require "release/api/knowledge.php"; $n=0; foreach($k as $e){if(str_starts_with((string)($e["label"]??""), "09. Zenei kifejezések / ")) ++$n;} if($n!==1793){fwrite(STDERR, "Missing chapter 09 PHP glossary entries: $n/1793\\n"); exit(1);} echo "Chapter 09 PHP glossary coverage passed: $n/1793\\n";'
          # A-08: protect all six student-facing teaching banks against
          # missing PHP exports, while allowing different chunking strategies.
          php -r '$k=require "release/api/knowledge.php"; $wanted=["Zeneelméleti Műhely – Szókártyák","Zeneelméleti Műhely – Teszt","Zeneelméleti Műhely – Párosító","Zeneelméleti Műhely – Hangzó hangsor és akkord","Zeneelméleti Műhely – Hangkészletek és pentaton példák","Zeneelméleti Műhely – Kvintkör"]; foreach($wanted as $source){$n=0;foreach($k as $e){if(($e["source"]??"")===$source)++$n;}if($n===0){fwrite(STDERR,"Missing PHP teaching bank: $source\n");exit(1);}echo "$source: $n indexed entries\n";}'
          php -r 'require "php/api/creative-answers.php"; $k=require "release/api/knowledge.php"; $a=creativePracticeAnswer("Ajánlj játékos módszert a ritmusérzék fejlesztésére!",$k); if(!is_string($a)||!str_contains($a,"Szirányi Borbála")||!str_contains($a,"**Forrás:**")) {fwrite(STDERR,"Creative tutor integration failed\\n"); exit(1);} echo "Creative tutor integration passed\\n";'
          php -r '$a=require "release/api/knowledge.php"; foreach($a as $e){if(stripos($e["source"]??"", "kesztler")!==false) {fwrite(STDERR,"Excluded OCR text found in index\\n"); exit(1);}} echo "Source blacklist verified\\n";'
          # Stamp the exact checked-out source tree in both frontend and
          # PHP metadata; detect mixed-version CloudPanel uploads at runtime.
          python3 scripts/stamp-php-release.py release "$(git rev-parse HEAD)"
          python3 scripts/verify-release-assets.py release
          cd release
          zip -q -r ../zeneelmeleti-muhely-php.zip .
      - name: Upload deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: zeneelmeleti-muhely-php
          path: zeneelmeleti-muhely-php.zip
          retention-days: 14
          if-no-files-found: error
